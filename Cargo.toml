[package]
name = "bloomrepo"
version = "2.1.0"
edition = "2021"
authors = ["GUIAR OQBA"]
description = "Reliable GitHub repository discovery and monitoring engine"

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
regex = "1.10"
colored = "2.1"
eframe = "0.29"
webbrowser = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
