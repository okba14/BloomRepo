# BloomRepo 3.0: non-secret configuration example.
# Secrets belong in the process environment or .env beside this config file.
# Process environment values override .env, including empty values.
# Relative storage paths use the process working directory, not this file's directory.

[general]
# Per-cycle budgets and polling intervals do not guarantee exhaustive coverage.
interval_seconds = 30
max_pages_per_cycle = 5
lookback_hours = 3
log_level = "info"
max_concurrent_requests = 4
search_interval_seconds = 60

[auth]
timeout_seconds = 25
user_agent = "BloomRepo/3.0 (+https://github.com/)"
# Keep shared examples credential-free; use GITHUB_TOKEN or GITHUB_TOKENS.
tokens = []

[streams]
enable_sequential_stream = true
enable_events_stream = true
enable_search_stream = true
# Empty means a general created-time search, still subject to GitHub indexing limits.
# A new empty installation needs search/events to establish a verified ID anchor.
search_queries = []

[monitoring]
enabled = true
watch_interval_seconds = 900
enrich_per_cycle = 10
watch_per_cycle = 10

[filtering]
enable_spam_filter = true
ignore_forks = true
min_description_length = 0
ignore_name_patterns = [
    "^auto-repo-\\d+",
    "^repo-\\d+$",
    "^test-\\d+$",
    "^homework-"
]
priority_keywords = []
# Keywords indicate interest, not security risk. Empty language list allows any language.
allowed_languages = []

[storage]
# Use a private local directory with an existing parent and no links/junctions.
database_path = "repos.db"
# Legacy one-time import only when SQLite has no state; SQLite is authoritative.
state_path = "_state.json"
# The database uses synchronous=FULL even when WAL is disabled.
enable_wal = true
# Idempotent per-event outputs/YYYY-MM/repo-... shards beside the database.
# Legacy monthly aggregate files are left intact; output publication needs hard links.
enable_log_file = true
enable_jsonl_stream = true

[notifications]
# Optional Windows-only toast; uses a fixed PowerShell script, not repository code.
enable_windows_toast = true
toast_priority_only = false
timeout_seconds = 10
max_items_per_message = 5
# External channels stay disabled unless their environment/.env values are set:
# DISCORD_WEBHOOK_URL, TELEGRAM_BOT_TOKEN + TELEGRAM_CHAT_ID, WEBHOOK_URL.
# Destinations must be public HTTPS with no URL userinfo or fragment.
# Localhost/private IPs and redirects are rejected; delivery bypasses proxy discovery.
# Remote delivery can repeat. A custom receiver must persistently deduplicate the
# Idempotency-Key header / JSON idempotency_key; Discord/Telegram may show duplicates.
